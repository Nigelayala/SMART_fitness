<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalles del Entrenamiento | Smart Fitness</title>
    <link rel="stylesheet" href="styless.css">
    <link rel="stylesheet" href="detalles.css">
</head>
<body>
    <header>
        <div class="logo">SMART <span class="accent-text">FITNESS</span></div>
        <nav>
            <ul>
                <li><a href="index.html">Inicio</a></li>
                <li><a href="calculadora.html">Calculadora</a></li>
                <li><a href="registro.html">Registro</a></li>
                <li><a href="mapamusculo.html">Mapa Interactivo</a></li>
                <li><a href="nutricion.html">Suplementación</a></li>
                <li><a href="rutinas.html">Rutinas</a></li>
            </ul>
        </nav>
    </header>

    <main class="detail-container">
        <div class="navigation-area">
            <a href="registro.html" class="back-link">← Volver al Historial</a>
        </div>

        <section class="session-header">
            <h1 id="det-titulo">Cargando sesión...</h1>
            <div class="session-meta">
                <span id="det-fecha" class="badge">---</span>
                <span id="det-ejercicios-count" class="badge secondary">---</span>
            </div>
        </section>

        <div id="lista-detalles-ejercicios" class="exercises-grid">
            </div>
    </main>

<footer>
        <p>Smart Fitness &copy; 2025 | Política de Privacidad | <span class="accent-text">Análisis de progreso.</span></p>
    </footer>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // 1. Obtener el ID de la sesión que guardamos al hacer clic en registro.js
            const idBuscado = localStorage.getItem('sesion_detalles_id');
            const historial = JSON.parse(localStorage.getItem('historialSesiones')) || [];
            
            // 2. Buscar la sesión específica
            const sesion = historial.find(s => s.id == idBuscado);

            if (!sesion) {
                alert("No se ha encontrado la información de este entrenamiento.");
                window.location.href = 'registro.html';
                return;
            }

            // 3. Rellenar cabecera
            document.getElementById('det-titulo').textContent = sesion.rutina;
            document.getElementById('det-fecha').textContent = `📅 ${sesion.fecha}`;
            document.getElementById('det-ejercicios-count').textContent = `💪 ${sesion.ejercicios.length} Ejercicios`;

            // 4. Renderizar ejercicios y sus series
            const contenedor = document.getElementById('lista-detalles-ejercicios');
            
            contenedor.innerHTML = sesion.ejercicios.map(ej => `
                <div class="exercise-card">
                    <div class="exercise-card-header">
                        <h3>${ej.nombre}</h3>
                    </div>
                    <div class="series-container">
                        ${ej.series.map((s, i) => `
                            <div class="serie-box">
                                <span class="serie-number">SET ${i + 1}</span>
                                <span class="weight-value">${s.peso}<small>kg</small></span>
                                <span class="reps-value">${s.reps} <small>reps</small></span>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `).join('');
        });
    </script>
</body>
</html>
